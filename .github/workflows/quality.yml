name: Prototype quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    env:
      TEST_REPORT_PATH: docs/evaluation/ci-tests.txt
      BROWSER_REPORT_PATH: docs/evaluation/ci-browser.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify
      - run: npm run benchmark
      - run: npm run benchmark:phase4
      - run: npm run validate:clean
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
        if: vars.ALLOW_NPM_ADVISORY_AUDIT == 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            docs/evaluation/ci-tests.txt
            docs/evaluation/ci-browser.txt
            docs/evaluation/reconciliation-audit-results.json
            docs/evaluation/current-browser.txt
            docs/evaluation/clean-start.json
            docs/evaluation/phase-4e-load.json
            docs/evaluation/phase-4e-load-progress-*.jsonl
            test-results/
